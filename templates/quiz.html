<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Quiz Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <style>
        .question-container {
            display: none;
        }
        .question-container.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">{{ quiz.chapter.name }} Quiz</h5>
                <div class="d-flex align-items-center">
                    <span class="badge bg-primary me-3">Question <span id="currentQuestion">1</span> of {{ quiz.questions|length }}</span>
                    <div id="timer" class="badge bg-warning text-dark">Time Left: {{ quiz.time_duration }}</div>
                </div>
            </div>
            <div class="card-body">
                <form id="quizForm" method="POST" action="{{ url_for('submit_quiz', quiz_id=quiz.id) }}">
                    {% for question in quiz.questions %}
                    <div class="question-container {% if loop.first %}active{% endif %}" id="question{{ loop.index }}">
                        <h5 class="card-title">{{ question.question_statement }}</h5>
                        <div class="options mt-3">
                            {% for option in question.options %}
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" 
                                       name="answer{{ question.id }}" 
                                       id="option{{ question.id }}_{{ loop.index }}"
                                       value="{{ option }}"
                                       {% if saved_answers and saved_answers.get(question.id|string) == option %}checked{% endif %}>
                                <label class="form-check-label" for="option{{ question.id }}_{{ loop.index }}">
                                    {{ option }}
                                </label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                    {% endfor %}

                    <div class="mt-4 d-flex justify-content-between">
                        <button type="button" id="prevBtn" class="btn btn-secondary" style="display: none;" onclick="showPreviousQuestion()">Previous</button>
                        <div>
                            <button type="button" id="nextBtn" class="btn btn-primary" onclick="saveAndNext()">Save & Next</button>
                            <button type="submit" id="submitBtn" class="btn btn-success" style="display: none;">Submit Quiz</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentQuestionIndex = 1;
        const totalQuestions = parseInt('{{ quiz.questions|length }}');
        
        function showQuestion(index) {
            document.querySelectorAll('.question-container').forEach(q => {
                q.classList.remove('active');
            });
            
            document.getElementById(`question${index}`).classList.add('active');
            document.getElementById('currentQuestion').textContent = index;
            
            document.getElementById('prevBtn').style.display = index > 1 ? 'block' : 'none';
            document.getElementById('nextBtn').style.display = index < totalQuestions ? 'block' : 'none';
            document.getElementById('submitBtn').style.display = index === totalQuestions ? 'block' : 'none';
        }

        function saveAndNext() {
            const currentQuestion = document.getElementById(`question${currentQuestionIndex}`);
            const selectedAnswer = currentQuestion.querySelector('input[type="radio"]:checked');
            
            if (!selectedAnswer) {
                alert('Please select an answer before proceeding.');
                return;
            }

            const questionId = selectedAnswer.name.replace('answer', '');
            const answer = selectedAnswer.value;

            fetch(`/quiz/{{ quiz.id }}/save`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `question_id=${questionId}&answer=${encodeURIComponent(answer)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    if (currentQuestionIndex < totalQuestions) {
                        currentQuestionIndex++;
                        showQuestion(currentQuestionIndex);
                    }
                } else {
                    alert('Failed to save answer. Please try again.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to save answer. Please try again.');
            });
        }

        function showPreviousQuestion() {
            if (currentQuestionIndex > 1) {
                currentQuestionIndex--;
                showQuestion(currentQuestionIndex);
            }
        }

        function startTimer(duration) {
            let timer = duration * 60;
            const timerDisplay = document.getElementById('timer');
            
            const countdown = setInterval(() => {
                const minutes = parseInt(timer / 60, 10);
                const seconds = parseInt(timer % 60, 10);
                
                timerDisplay.textContent = `Time Left: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                
                if (--timer < 0) {
                    clearInterval(countdown);
                    document.getElementById('quizForm').submit();
                }
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const duration = parseInt('{{ quiz.time_duration.split(":")[0] }}');
            startTimer(duration);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
