<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Question - Quiz Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Quiz Master</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    {% if current_user.is_authenticated %}
                        {% if current_user.is_admin %}
                            <li class="nav-item">
                                <a class="nav-link" href="{{ url_for('admin_dashboard') }}">Admin Dashboard</a>
                            </li>
                        {% endif %}
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="mb-0">Edit Question</h3>
                <div>
                    <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteQuestionModal">
                        <i class="fas fa-trash"></i> Delete Question
                    </button>
                    <a href="{{ url_for('edit_quiz', quiz_id=question.quiz_id) }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Back to Quiz
                    </a>
                </div>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="question_statement" class="form-label">Question</label>
                        <textarea class="form-control" id="question_statement" name="question_statement" rows="3" required>{{ question.question_statement }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="option1" class="form-label">Option 1</label>
                        <input type="text" class="form-control" id="option1" name="option1" value="{{ question.option1 }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="option2" class="form-label">Option 2</label>
                        <input type="text" class="form-control" id="option2" name="option2" value="{{ question.option2 }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="option3" class="form-label">Option 3</label>
                        <input type="text" class="form-control" id="option3" name="option3" value="{{ question.option3 }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="option4" class="form-label">Option 4</label>
                        <input type="text" class="form-control" id="option4" name="option4" value="{{ question.option4 }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="correct_option" class="form-label">Correct Option (1-4)</label>
                        <select class="form-select" id="correct_option" name="correct_option" required>
                            <option value="1" {% if question.correct_option == 1 %}selected{% endif %}>Option 1</option>
                            <option value="2" {% if question.correct_option == 2 %}selected{% endif %}>Option 2</option>
                            <option value="3" {% if question.correct_option == 3 %}selected{% endif %}>Option 3</option>
                            <option value="4" {% if question.correct_option == 4 %}selected{% endif %}>Option 4</option>
                        </select>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Update Question</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Question Modal -->
    <div class="modal fade" id="deleteQuestionModal" tabindex="-1" aria-labelledby="deleteQuestionModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteQuestionModalLabel">Delete Question</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this question? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="deleteQuestion()">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        function deleteQuestion() {
            const modal = document.getElementById('deleteQuestionModal');
            const modalInstance = bootstrap.Modal.getInstance(modal);
            
            $.ajax({
                url: "{{ url_for('delete_question', question_id=question.id) }}",
                type: "POST",
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                },
                success: function(response) {
                    if (response.success) {
                        modalInstance.hide();
                        window.location.href = "{{ url_for('edit_quiz', quiz_id=question.quiz_id) }}";
                    } else {
                        alert('Error deleting question: ' + response.error);
                    }
                },
                error: function(xhr, status, error) {
                    alert('Error deleting question: ' + error);
                }
            });
        }
    </script>
</body>
</html>
